services:
    postgres:
      image: postgres:16
      container_name: liparibank-postgres
      environment:
        POSTGRES_DB: liparibankdb
        POSTGRES_USER: lipari
        POSTGRES_PASSWORD: lipari123
      ports:
        - "5432:5432"
      volumes:
        - liparibank-data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U lipari -d liparibankdb"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
    liparibank-data: